title: PowerShell Encoded Command Execution
id: 01710358-0aa8-4471-bdeb-f4e7f903bec1
status: test
description: |
  Detects PowerShell started with a Base64 encoded command line (-EncodedCommand and its
  abbreviations), a common way for loaders and C2 frameworks to hide the executed script.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://learn.microsoft.com/en-us/powershell/module/microsoft.powershell.core/about/about_pwsh
author: 108M
date: 2026-11-14
tags:
  - attack.execution
  - attack.t1059.001
  - attack.stealth
  - attack.t1027.010
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_flag:
    CommandLine|contains|windash:
      - ' -e '
      - ' -en '
      - ' -enc '
      - ' -enco'
      - ' -ec '
      - ' -EncodedCommand '
  filter_optional_sccm:
    ParentImage|endswith: '\CCM\CcmExec.exe'
  condition: all of selection_* and not 1 of filter_optional_*
falsepositives:
  - Management agents and installers that wrap scripts in -EncodedCommand
level: medium
