title: Windows Event Log Cleared via Command Line
id: 9ab11ab5-21e8-4fc3-8897-6ea35e055841
status: test
description: |
  Detects clearing of Windows event logs with wevtutil or PowerShell cmdlets, used by
  attackers to remove evidence after intrusion.
references:
  - https://attack.mitre.org/techniques/T1685/005/
  - https://learn.microsoft.com/en-us/windows-server/administration/windows-commands/wevtutil
author: 108M
date: 2026-11-14
tags:
  - attack.defense-impairment
  - attack.t1685.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_wevtutil_img:
    - Image|endswith: '\wevtutil.exe'
    - OriginalFileName: 'wevtutil.exe'
  selection_wevtutil_cmd:
    CommandLine|contains:
      - ' cl '
      - ' clear-log '
  selection_powershell:
    CommandLine|contains:
      - 'Clear-EventLog'
      - 'Remove-EventLog'
      - 'Limit-EventLog'
      - '.ClearLog('
  condition: all of selection_wevtutil_* or selection_powershell
falsepositives:
  - Administrators clearing logs on lab or freshly provisioned hosts
level: high
