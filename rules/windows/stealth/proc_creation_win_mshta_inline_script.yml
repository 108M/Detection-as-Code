title: Mshta Executing Inline Script Protocol
id: 6023c92e-309a-4545-83e9-207da9201811
status: test
description: |
  Detects mshta.exe running script passed inline on the command line through the
  vbscript:, javascript: or about: protocol handlers (e.g. vbscript:Execute(...),
  javascript:a=GetObject("script:https://...")). It is a classic signed-binary proxy
  execution to run code without dropping an .hta file; legitimate HTML Applications
  are launched with a file path or URL, not inline script.
references:
  - https://attack.mitre.org/techniques/T1218/005/
  - https://lolbas-project.github.io/lolbas/Binaries/Mshta/
  - https://github.com/redcanaryco/atomic-red-team/blob/master/atomics/T1218.005/T1218.005.md
author: 108M
date: 2026-11-16
tags:
  - attack.stealth
  - attack.t1218.005
  - attack.execution
  - attack.t1059.005
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\mshta.exe'
    - OriginalFileName: 'MSHTA.EXE'
  selection_protocol:
    CommandLine|contains:
      - 'vbscript:'
      - 'javascript:'
      - 'about:'
  condition: all of selection_*
falsepositives:
  - Legacy line-of-business tooling that launches mshta with inline script (rare; baseline and exclude by parent process)
level: high
