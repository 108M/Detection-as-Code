# Attack telemetry used by `dac test`.
#
# Third-party datasets are NOT committed: `dac datasets fetch` downloads them from a
# pinned commit, verifies the sha256 and normalises them to ECS under .cache/datasets.
# Every rule is run against EVERY dataset: hits in datasets that a rule's test case
# does not list are counted as false positives, so the background activity recorded
# in each capture (svchost, updates, agents...) doubles as a benign corpus.
#
# Licences: OTRF Security-Datasets (MIT), Splunk attack_data (Apache-2.0).

sources:
  otrf:
    base_url: https://raw.githubusercontent.com/OTRF/Security-Datasets/d9d40ef123d2c87d5d3df28c96bcab4f0faccc87/datasets/atomic/windows
    format: otrf-json
  splunk:
    # Files are stored in Git LFS: fetched through the media endpoint.
    base_url: https://media.githubusercontent.com/media/splunk/attack_data/4b19e4b6824a8ba91b0f5345a3a8de488619e823/datasets/attack_techniques
    format: windows-xml

