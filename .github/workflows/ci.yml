name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DAC_ATTACK_VERSION: "20.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check --output-format=github dac tests
          ruff format --check dac tests
      - name: Yamllint
        run: yamllint -c .yamllint -f github rules .github lab

  validate:
    name: Validate rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Cache ATT&CK index
        uses: actions/cache@v4
        with:
          path: .cache/attack
          key: attack-${{ env.DAC_ATTACK_VERSION }}-${{ hashFiles('dac/attack.py') }}
      - name: dac validate
        run: dac validate
      - name: Unit tests
        run: pytest -q
      - name: dac convert
        run: dac convert --show
      - name: Upload Elastic rules
        uses: actions/upload-artifact@v4
        with:
          name: elastic-rules
          path: build/rules.ndjson
          if-no-files-found: error

  detection-tests:
    name: Detection tests
    runs-on: ubuntu-latest
    needs: validate
    services:
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
        env:
          discovery.type: single-node
          xpack.security.enabled: "false"
          cluster.routing.allocation.disk.threshold_enabled: "false"
          ES_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fs http://localhost:9200/_cat/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    env:
      DAC_ES_URL: http://localhost:9200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Cache ATT&CK index
        uses: actions/cache@v4
        with:
          path: .cache/attack
          key: attack-${{ env.DAC_ATTACK_VERSION }}-${{ hashFiles('dac/attack.py') }}
      - name: Cache datasets
        uses: actions/cache@v4
        with:
          path: .cache/datasets/raw
          key: datasets-${{ hashFiles('tests/datasets/sources.yml') }}
      - name: Fetch and verify datasets
        run: dac datasets fetch
      - name: dac test
        run: dac test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detection-test-report
          path: build/test-report.json
          if-no-files-found: ignore
