name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DAC_ATTACK_VERSION: "20.1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check --output-format=github dac tests
          ruff format --check dac tests
      - name: Yamllint
        run: yamllint -c .yamllint -f github rules .github lab

  validate:
    name: Validate rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Cache ATT&CK index
        uses: actions/cache@v4
        with:
          path: .cache/attack
          key: attack-${{ env.DAC_ATTACK_VERSION }}-${{ hashFiles('dac/attack.py') }}
      - name: dac validate
        run: dac validate
      - name: Unit tests
        run: pytest -q
      - name: dac convert
        run: dac convert --show
      - name: Upload Elastic rules
        uses: actions/upload-artifact@v4
        with:
          name: elastic-rules
          path: build/rules.ndjson
          if-no-files-found: error
